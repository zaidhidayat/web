<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJ BATUR</title>
    <!-- Menggunakan Tailwind CSS untuk styling komponen omzet -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Menggunakan Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-color: #000;
            --secondary-color: #fff;
            --accent-color: #FFD700;
            --text-color: #fff;
            --text-color-dark: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color-dark);
        }

        header {
            background-color: var(--primary-color);
            color: var(--secondary-color);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 100%;
            margin: 0 auto;
        }

        .header-text h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--accent-color);
        }

        .header-text h2 {
            font-size: 0.8rem;
            margin: 0;
            font-weight: normal;
            color: var(--secondary-color);
            text-transform: uppercase;
        }

        .hamburger-menu {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -250px;
            width: 250px;
            height: 100%;
            background-color: var(--primary-color);
            color: var(--secondary-color);
            transition: right 0.3s ease;
            z-index: 999;
            padding-top: 80px;
            box-shadow: -2px 0 5px rgba(0,0,0,0.2);
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li a {
            display: block;
            padding: 1rem;
            text-decoration: none;
            color: var(--secondary-color);
            transition: background-color 0.2s;
        }

        .sidebar li a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        main {
            padding-top: 80px;
            padding-left: 1rem;
            padding-right: 1rem;
            max-width: 100%;
            min-height: calc(100vh - 80px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background-color: var(--secondary-color);
            color: var(--text-color-dark);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            border: 1px solid var(--primary-color);
            padding: 0.75rem;
            text-align: left;
        }

        th {
            background-color: var(--primary-color);
            color: var(--accent-color);
            font-weight: bold;
            text-transform: uppercase;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .image-container {
            width: 100%;
            max-width: 600px;
            margin: 1rem auto;
            text-align: center;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            border: 2px solid var(--accent-color);
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            margin-top: 1rem;
            text-decoration: none;
            color: var(--secondary-color);
            background-color: var(--accent-color);
            border: none;
            cursor: pointer;
            font-size: 1rem;
            text-align: center;
            transition: background-color 0.3s;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #b8860b;
        }

        .centered-content {
            text-align: center;
        }

        .k3-list {
            list-style-type: none;
            padding: 0;
            max-width: 600px;
            margin: 2rem auto;
        }

        .k3-list li {
            background: #f9f9f9;
            margin-bottom: 1rem;
            padding: 1rem;
            border-left: 5px solid var(--accent-color);
            font-size: 1.1rem;
            line-height: 1.5;
        }

        /* Transisi halus saat berganti tab atau memunculkan hasil */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-text">
                <h1>PJ BATUR</h1>
                <h2 id="page-title"></h2>
            </div>
            <button class="hamburger-menu" aria-label="Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <nav class="sidebar">
        <ul>
            <li><a href="#" data-page="patroli-row">Patroli ROW</a></li>
            <li><a href="#" data-page="jadwal-piket">Jadwal Piket</a></li>
            <li><a href="#" data-page="urban">Urban</a></li>
            <li><a href="#" data-page="omzet">Omzet Beban</a></li>
            <li><a href="#" data-page="hitung-omzet">Hitung Omzet</a></li>
            <li><a href="#" data-page="mandorline">Mandorline</a></li>
            <li><a href="#" data-page="pemadaman">Pemadaman</a></li>
            <li><a href="#" data-page="kct">KCT</a></li>
            <li><a href="#" data-page="penol">Minta P0</a></li>
            <li><a href="#" data-page="Sigap Manual">Sigap Manual</a></li>
            <li><a href="#" data-page="vkrn_sanxing">VKRN SANXING</a></li>
            <li><a href="#" data-page="k3">K3</a></li>
        </ul>
    </nav>

    <main id="content">
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hamburgerBtn = document.querySelector('.hamburger-menu');
            const sidebar = document.querySelector('.sidebar');
            const pageTitleElement = document.getElementById('page-title');
            const contentContainer = document.getElementById('content');
            const navLinks = document.querySelectorAll('.sidebar ul li a');

            hamburgerBtn.addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });

            document.addEventListener('click', (event) => {
                if (!sidebar.contains(event.target) && !hamburgerBtn.contains(event.target)) {
                    sidebar.classList.remove('open');
                }
            });

            navLinks.forEach(link => {
                link.addEventListener('click', (event) => {
                    event.preventDefault();
                    const page = event.target.getAttribute('data-page');
                    loadPage(page);
                    sidebar.classList.remove('open');
                    
                    // Menggulir ke paling atas saat menu diklik dengan efek halus
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                });
            });

            const loadPage = (pageName) => {
                let content = '';
                let pageTitle = '';

                switch (pageName) {
                    case 'patroli-row':
                        pageTitle = 'Patroli ROW';
                        content = `<div class="image-container"><img src="assets/patroli.jpg" alt="Gambar Patroli"></div>`;
                        break;
                    case 'jadwal-piket':
                        pageTitle = 'Jadwal Piket';
                        content = `<div class="image-container"><img src="assets/jadwal.jpg" alt="Gambar Jadwal Piket"></div>`;
                        break;
                    case 'urban':
                        pageTitle = 'Urban';
                        fetchAndDisplayTable('assets/urban.csv', (table) => {
                            contentContainer.innerHTML = table;
                            
                            const rows = contentContainer.querySelectorAll('tr');
                            
                            rows.forEach((row, index) => {
                                // 1. Targetkan baris ke-2 (index 1) dan ke-14 (index 13) untuk digabung
                                if (index === 15 ) {
                                    const firstCell = row.children[0];
                                    
                                    if (firstCell) {
                                        firstCell.setAttribute('colspan', '4');
                                        firstCell.style.backgroundColor = '#FFD700'; // Background Emas
                                        firstCell.style.color = 'black';            // Teks Hitam
                                        firstCell.style.fontWeight = 'bold';        
                                        
                                        while (row.children.length > 1) {
                                            row.removeChild(row.lastChild);
                                        }
                                    }
                                } 
                                // 2. Baris normal lainnya, tapi KECUALIKAN baris header (index 0)
                                else if (index > 0) {
                                    // Formatting untuk Kolom 3 (Index 2)
                                    if (row.children[2]) {
                                        row.children[2].style.textAlign = 'center';
                                        // Cek apakah sel ada isinya (tidak kosong)
                                        if (row.children[2].textContent.trim() !== '') {
                                            row.children[2].style.backgroundColor = 'lightgreen'; // Hijau muda agar centang terlihat
                                        }
                                    }
                                    
                                    // Formatting untuk Kolom 4 (Index 3)
                                    if (row.children[3]) {
                                        row.children[3].style.textAlign = 'center';
                                        // Cek apakah sel ada isinya (tidak kosong)
                                        if (row.children[3].textContent.trim() !== '') {
                                            row.children[3].style.backgroundColor = 'lightgreen'; // Hijau muda agar centang terlihat
                                        }
                                    }
                                }
                            });
                        });
                        break;
                    case 'omzet':
                        pageTitle = 'Omzet Beban';
                        fetchAndDisplayTable('assets/omzet.csv', (table) => {
                            contentContainer.innerHTML = table;
                            const rows = contentContainer.querySelectorAll('tr');
                            
                            rows.forEach((row, index) => {
                                // Kolom 3 (Index 2)
                                if (row.children[2]) {
                                    row.children[2].style.textAlign = 'center';
                                    
                                    // Beri warna background lightgreen jika ada isinya
                                    // DAN pastikan ini bukan baris judul (index !== 0)
                                    if (index !== 0 && row.children[2].textContent.trim() !== '') {
                                        row.children[2].style.backgroundColor = 'lightgreen';
                                    }
                                }
                                
                                // Kolom 4 (Index 3)
                                if (row.children[3]) {
                                    row.children[3].style.textAlign = 'center';
                                }
                            });
                        });
                        break;
                    case 'hitung-omzet':
                        pageTitle = 'Hitung Omzet';
                        content = `
                        <div class="bg-slate-50 text-slate-800 font-sans selection:bg-blue-200 rounded-lg pb-10">
                            <!-- Navbar -->
                            <div id="hitung-omzet-navbar" class="bg-blue-600 text-white shadow-md rounded-t-lg transition-all duration-300">
                                <div class="max-w-3xl mx-auto px-4">
                                    <div class="flex items-center justify-between h-16">
                                        <div class="flex items-center space-x-2 font-bold text-xl">
                                            <i data-lucide="zap" class="h-6 w-6 text-yellow-300"></i>
                                            <span>Hitung Omzet</span>
                                        </div>
                                        <div class="flex space-x-2">
                                            <button id="btn-tab-1fasa" onclick="window.switchTab('1fasa')" class="px-4 py-2 rounded-md text-sm font-medium transition-colors bg-blue-800 text-white shadow-inner border border-blue-900">
                                                1 Fasa
                                            </button>
                                            <button id="btn-tab-3fasa" onclick="window.switchTab('3fasa')" class="px-4 py-2 rounded-md text-sm font-medium transition-colors text-blue-100 hover:bg-blue-500">
                                                3 Fasa
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Main Content -->
                            <div class="max-w-3xl mx-auto p-4 md:p-6 lg:p-8 mt-4">
                                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                    
                                    <!-- SECTION 1 FASA -->
                                    <div id="section-1fasa" class="p-6 block fade-in">
                                        <div class="space-y-4 mb-6">
                                            <div class="flex items-center space-x-2 sm:space-x-3">
                                                <label class="text-base font-bold text-slate-700 w-8">X1</label>
                                                <input type="number" id="input-x1" onfocus="window.hideHitungOmzetNavbar()" placeholder="0" class="w-24 sm:w-32 px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                                                <span class="text-sm font-medium text-slate-600 whitespace-nowrap">Ampere</span>
                                            </div>
                                            <div class="flex items-center space-x-2 sm:space-x-3">
                                                <label class="text-base font-bold text-slate-700 w-8">X4</label>
                                                <input type="number" id="input-x4" onfocus="window.hideHitungOmzetNavbar()" placeholder="0" class="w-24 sm:w-32 px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                                                <span class="text-sm font-medium text-slate-600 whitespace-nowrap">Ampere</span>
                                            </div>
                                        </div>

                                        <button onclick="window.hitung1Fasa()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center space-x-2 transition-colors focus:ring-4 focus:ring-blue-200 border-none cursor-pointer">
                                            <i data-lucide="calculator" class="h-5 w-5"></i>
                                            <span>Hitung Penyeimbang</span>
                                        </button>

                                        <!-- Container Hasil 1 Fasa -->
                                        <div id="result-1fasa" class="mt-8 hidden fade-in"></div>
                                    </div>

                                    <!-- SECTION 3 FASA -->
                                    <div id="section-3fasa" class="p-6 hidden fade-in">
                                        <div class="space-y-4 mb-6">
                                            <div class="flex items-center space-x-2 sm:space-x-3">
                                                <label class="text-base font-bold text-slate-700 w-16">Fasa R</label>
                                                <input type="number" id="input-r" onfocus="window.hideHitungOmzetNavbar()" placeholder="0" class="w-24 sm:w-32 px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                                                <span class="text-sm font-medium text-slate-600 whitespace-nowrap">Ampere</span>
                                            </div>
                                            <div class="flex items-center space-x-2 sm:space-x-3">
                                                <label class="text-base font-bold text-slate-700 w-16">Fasa S</label>
                                                <input type="number" id="input-s" onfocus="window.hideHitungOmzetNavbar()" placeholder="0" class="w-24 sm:w-32 px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                                                <span class="text-sm font-medium text-slate-600 whitespace-nowrap">Ampere</span>
                                            </div>
                                            <div class="flex items-center space-x-2 sm:space-x-3">
                                                <label class="text-base font-bold text-slate-700 w-16">Fasa T</label>
                                                <input type="number" id="input-t" onfocus="window.hideHitungOmzetNavbar()" placeholder="0" class="w-24 sm:w-32 px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                                                <span class="text-sm font-medium text-slate-600 whitespace-nowrap">Ampere</span>
                                            </div>
                                        </div>

                                        <button onclick="window.hitung3Fasa()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center space-x-2 transition-colors focus:ring-4 focus:ring-blue-200 border-none cursor-pointer">
                                            <i data-lucide="calculator" class="h-5 w-5"></i>
                                            <span>Hitung & Simulasikan</span>
                                        </button>

                                        <!-- Container Hasil 3 Fasa -->
                                        <div id="result-3fasa" class="mt-8 hidden fade-in"></div>
                                    </div>

                                </div>
                            </div>
                        </div>
                        `;
                        break;
                    case 'mandorline':
                        pageTitle = 'Mandorline';
                        fetchAndDisplayTable('assets/mandorline.csv');
                        break;
                    case 'pemadaman':
                        pageTitle = 'Pemadaman';
                        fetchAndDisplayTable('assets/pemadaman.csv');
                        break;
                    case 'kct':
                        pageTitle = 'KCT';
                        content = `<div class="centered-content"><a href="https://pdpjpwt.my.id/" target="_blank" class="btn">Buka Halaman KCT</a></div>`;
                        break;
                    case 'penol':
                        pageTitle = 'Minta P0';
                        content = `<div class="centered-content"><a href="https://www.appsheet.com/start/6def9c97-cb1d-43d8-84fb-38314047e433#appName=ComcenDJTY-1509236&group=%5B%7B%22Column%22%3A%22STATUS%22%2C%22Order%22%3A%22Ascending%22%7D%5D&page=fastTable&sort=%5B%7B%22Column%22%3A%22Tgl_Permohonan%22%2C%22Order%22%3A%22Ascending%22%7D%5D&table=P0&view=Permohonan+P0" target="_blank" class="btn">Minta P0</a></div>`;
                        break;
                    case 'Sigap Manual':
                        pageTitle = 'Sigap Manual';
                        content = `<div class="centered-content"><a href="https://docs.google.com/forms/d/e/1FAIpQLSeDwcB0smGTTd1TWgalHrcT49nf3aRg9YRjGrbfZAnSX6vYmQ/viewform" target="_blank" class="btn">Sigap Manual</a></div>`;
                        break;
                    case 'vkrn_sanxing':
                        pageTitle = 'VKRN SANXING';
                        content = `<div class="centered-content"><a href="https://mashidayat24.github.io/tewbo/" target="_blank" class="btn">Buka Halaman VKRN SANXING</a></div>`;
                        break;
                    case 'k3':
                        pageTitle = 'Yel-yel';
                        content = `
                            <ul class="k3-list">
                                <li>Selamat Pagi</li>
                                <li>Pagi, pagi, pagi</li>
                                <li></li>
                                <li>PLN ES</li>
                                <li>Berakhlak, Andal, Terbaik</li>
                                <li></li>
                                <li>ELECTRINERS</li>
                                <li>Safety, Integrity, Quality</li>
                            </ul>
                        `;
                        break;
                }

                pageTitleElement.textContent = pageTitle;
                if (pageName === 'urban' || pageName === 'mandorline' || pageName === 'pemadaman') {
                    // Konten akan dimuat oleh fetchAndDisplayTable
                } else {
                    contentContainer.innerHTML = content;
                }

                if (pageName === 'hitung-omzet' && typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            };

            const fetchAndDisplayTable = (filePath, callback = null) => {
                fetch(filePath)
                    .then(response => response.text())
                    .then(data => {
                        const rows = data.split('\n').filter(row => row.trim() !== '');
                        const tableHtml = `
                            <table>
                                <thead>
                                    <tr>
                                        ${rows[0].split(',').map(header => `<th>${header.trim()}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows.slice(1).map(row => {
                                        const cells = row.split(',').map(cell => `<td>${cell.trim()}</td>`).join('');
                                        return `<tr>${cells}</tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                        `;
                        contentContainer.innerHTML = tableHtml;
                        if (callback) {
                            callback(tableHtml);
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching CSV:', error);
                        contentContainer.innerHTML = `<p>Gagal memuat data tabel.</p>`;
                    });
            };

            loadPage('patroli-row');
        });

        // Global functions untuk Hitung Omzet
        window.switchTab = function(tabId) {
            const sec1 = document.getElementById('section-1fasa');
            const sec3 = document.getElementById('section-3fasa');
            const btn1 = document.getElementById('btn-tab-1fasa');
            const btn3 = document.getElementById('btn-tab-3fasa');

            if (tabId === '1fasa') {
                sec1.classList.remove('hidden');
                sec1.classList.add('block');
                sec3.classList.add('hidden');
                sec3.classList.remove('block');

                btn1.className = "px-4 py-2 rounded-md text-sm font-medium transition-colors bg-blue-800 text-white shadow-inner border border-blue-900";
                btn3.className = "px-4 py-2 rounded-md text-sm font-medium transition-colors text-blue-100 hover:bg-blue-500 border border-transparent";
            } else {
                sec3.classList.remove('hidden');
                sec3.classList.add('block');
                sec1.classList.add('hidden');
                sec1.classList.remove('block');

                btn3.className = "px-4 py-2 rounded-md text-sm font-medium transition-colors bg-blue-800 text-white shadow-inner border border-blue-900";
                btn1.className = "px-4 py-2 rounded-md text-sm font-medium transition-colors text-blue-100 hover:bg-blue-500 border border-transparent";
            }
        };

        window.getErrorHtml = function(msg) {
            return `
                <div class="p-4 bg-red-50 text-red-700 rounded-lg flex items-start space-x-3 border border-red-100">
                    <i data-lucide="alert-circle" class="h-5 w-5 shrink-0 mt-0.5"></i>
                    <p>${msg}</p>
                </div>
            `;
        };

        window.hideHitungOmzetNavbar = function() {
            const navbar = document.getElementById('hitung-omzet-navbar');
            if (navbar) {
                navbar.classList.add('hidden');
                // Menggulirkan perlahan ke atas agar input tidak tertutup keyboard
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.showHitungOmzetNavbar = function() {
            const navbar = document.getElementById('hitung-omzet-navbar');
            if (navbar) {
                navbar.classList.remove('hidden');
            }
        };

        window.hitung1Fasa = function() {
            window.showHitungOmzetNavbar();
            
            const container = document.getElementById('result-1fasa');
            container.classList.remove('hidden');
            
            // Re-trigger animasi
            container.classList.remove('fade-in');
            void container.offsetWidth; 
            container.classList.add('fade-in');

            const valX1 = parseFloat(document.getElementById('input-x1').value);
            const valX4 = parseFloat(document.getElementById('input-x4').value);

            if (isNaN(valX1) || isNaN(valX4)) {
                container.innerHTML = window.getErrorHtml('Mohon masukkan angka yang valid untuk X1 dan X4.');
                lucide.createIcons();
                return;
            }

            const selisih = Math.abs(valX1 - valX4);
            const pindah = Math.round(selisih / 2);

            if (valX1 === valX4) {
                container.innerHTML = `
                    <div class="p-5 bg-green-50 rounded-xl border border-green-200 text-center mt-6">
                        <p class="text-green-700 font-medium text-lg">Beban sudah seimbang!</p>
                        <p class="text-green-600 text-sm mt-1">Tidak perlu ada pemindahan beban.</p>
                    </div>
                `;
                return;
            }

            let sumberTinggi = valX1 > valX4 ? 'X1' : 'X4';
            let targetRendah = valX1 > valX4 ? 'X4' : 'X1';
            
            let hasilOmzetTinggi = Math.round(Math.max(valX1, valX4) - pindah);
            let hasilOmzetRendah = Math.round(Math.min(valX1, valX4) + pindah);

            let simulasiHtml = '';
            if (sumberTinggi === 'X1') {
                simulasiHtml = `
                    <div class="flex justify-between items-center p-3 bg-red-50 text-red-800 rounded border border-red-100">
                        <span>X1 = ${valX1} - ${pindah}</span>
                        <span class="font-bold text-slate-800">= ${hasilOmzetTinggi} A</span>
                    </div>
                    <div class="flex justify-between items-center p-3 bg-green-50 text-green-800 rounded border border-green-100">
                        <span>X4 = ${valX4} + ${pindah}</span>
                        <span class="font-bold text-slate-800">= ${hasilOmzetRendah} A</span>
                    </div>
                `;
            } else {
                simulasiHtml = `
                    <div class="flex justify-between items-center p-3 bg-green-50 text-green-800 rounded border border-green-100">
                        <span>X1 = ${valX1} + ${pindah}</span>
                        <span class="font-bold text-slate-800">= ${hasilOmzetRendah} A</span>
                    </div>
                    <div class="flex justify-between items-center p-3 bg-red-50 text-red-800 rounded border border-red-100">
                        <span>X4 = ${valX4} - ${pindah}</span>
                        <span class="font-bold text-slate-800">= ${hasilOmzetTinggi} A</span>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="space-y-4 mt-6">
                    <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-lg shadow-sm">
                        <p class="text-blue-800 leading-relaxed text-sm md:text-base">
                            Pindah <span class="font-bold bg-blue-200 px-1 rounded">${pindah} Ampere</span> (${sumberTinggi}) ke ${targetRendah}.
                        </p>
                    </div>
                    <div class="bg-slate-50 rounded-xl p-5 border border-slate-200 shadow-inner">
                        <div class="bg-white p-4 rounded-lg border border-slate-200">
                            <h4 class="text-sm font-semibold text-slate-700 mb-3">Simulasi Omzet Beban:</h4>
                            <div class="space-y-3 font-mono text-sm md:text-base">
                                ${simulasiHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        };

        window.hitung3Fasa = function() {
            window.showHitungOmzetNavbar();
            
            const container = document.getElementById('result-3fasa');
            container.classList.remove('hidden');
            
            // Re-trigger animasi
            container.classList.remove('fade-in');
            void container.offsetWidth; 
            container.classList.add('fade-in');

            const valR = parseFloat(document.getElementById('input-r').value);
            const valS = parseFloat(document.getElementById('input-s').value);
            const valT = parseFloat(document.getElementById('input-t').value);

            if (isNaN(valR) || isNaN(valS) || isNaN(valT)) {
                container.innerHTML = window.getErrorHtml('Mohon masukkan angka yang valid untuk fasa R, S, dan T.');
                lucide.createIcons();
                return;
            }

            const total = Math.round(valR + valS + valT);
            const rataRata = Math.round(total / 3);

            const evaluasi = [
                { nama: 'R', nilai: valR, selisih: valR - rataRata },
                { nama: 'S', nilai: valS, selisih: valS - rataRata },
                { nama: 'T', nilai: valT, selisih: valT - rataRata },
            ];

            const seimbang = evaluasi.every(f => Math.abs(f.selisih) === 0);

            if (seimbang) {
                container.innerHTML = `
                    <div class="p-5 bg-green-50 rounded-xl border border-green-200 text-center mt-6">
                        <p class="text-green-700 font-medium text-lg">Semua Fasa Sudah Seimbang!</p>
                        <p class="text-green-600 text-sm mt-1">Setiap fasa memiliki arus rata-rata ${rataRata}A.</p>
                    </div>
                `;
                return;
            }

            let listHtml = '';
            evaluasi.forEach(fasa => {
                const selisihAbs = Math.abs(Math.round(fasa.selisih));
                const isSeimbang = selisihAbs === 0;
                
                let style = "bg-green-50 text-green-800 border-green-100";
                let hitungTeks = `${fasa.nilai}`;

                if (!isSeimbang) {
                    if (fasa.selisih > 0) {
                        style = "bg-red-50 text-red-800 border-red-100";
                        hitungTeks = `${fasa.nilai} - ${selisihAbs}`;
                    } else {
                        style = "bg-blue-50 text-blue-800 border-blue-100";
                        hitungTeks = `${fasa.nilai} + ${selisihAbs}`;
                    }
                }

                listHtml += `
                    <div class="flex justify-between items-center p-3 rounded border ${style}">
                        <span>${fasa.nama} = ${hitungTeks}</span>
                        <span class="font-bold text-slate-800">= ${rataRata} A</span>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="space-y-4 mt-6">
                    <div class="bg-slate-800 text-white p-5 rounded-xl flex justify-between items-center shadow-md">
                        <div>
                            <p class="text-slate-400 text-sm mb-1">Total Beban</p>
                            <p class="text-xl font-bold">${total}A</p>
                        </div>
                        <div class="text-right">
                            <p class="text-blue-300 text-sm mb-1">Patokan Seimbang (Rata-rata)</p>
                            <p class="text-2xl font-bold text-yellow-400">${rataRata}A <span class="text-sm font-normal text-slate-300">/ fasa</span></p>
                        </div>
                    </div>
                    <div class="bg-slate-50 rounded-xl p-5 border border-slate-200 shadow-inner mt-4">
                        <div class="bg-white p-4 rounded-lg border border-slate-200">
                            <h4 class="text-sm font-semibold text-slate-700 mb-3">Simulasi Penyeimbangan:</h4>
                            <div class="space-y-3 font-mono text-sm md:text-base">
                                ${listHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        };
    </script>
</body>
    </html>
